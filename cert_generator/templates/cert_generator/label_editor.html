
{% extends 'base.html' %}
{% load static %}

{% block content %}
<div class="container mt-5">
    <h2>Define Label Areas</h2>
    <p>Click and drag on the image to draw bounding boxes. You will be prompted to name each box if the input box is empty.</p>
    
    <!-- Hidden form tag to securely generate Django's CSRF token cookie/input -->
    {% csrf_token %}

    <div id="canvas-container" style="position: relative; display: inline-block; cursor: crosshair; user-select: none;">
        <img id="template-img" src="{{ template.image.url }}" style="max-width: 100%; display: block;">
    </div>

    <div class="mt-3">
        <input type="text" id="label-name-input" placeholder="Optional: Next Label Name (e.g. first_name)" class="form-control mb-2" style="max-width: 300px;">
        <button id="save-config" class="btn btn-success">Save Configuration & Continue</button>
    </div>
</div>

<script src="{% static 'cert_generator/js/builder.js' %}"></script>
{% endblock %}
